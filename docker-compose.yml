services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_DEBUG: "true"
      APP_BASE_PATH: ""
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: framework
      DB_USER: framework
      DB_PASS: framework
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: framework
      MYSQL_USER: framework
      MYSQL_PASSWORD: framework
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
